[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "bilby-laplace"
dynamic = ["version"]
description = "Bilby sampler plugin: Laplace approximation with rejection/importance resampling"
requires-python = ">=3.9"
dependencies = [
    "bilby>=2.7",
    "numpy",
    "scipy>=1.15",
    "pandas",
    "tqdm",
]

[project.optional-dependencies]
docs = [
    "mkdocs-material",
    "mkdocstrings[python]",
    "pymdown-extensions",
]
test = [
    "pytest",
    "pytest-cov",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: end-to-end sampler runs (deselect with '-m \"not slow\"')",
    "gw: requires the bilby.gw stack",
    "smc: requires aspire + aspire_bilby",
]

[tool.coverage.run]
source = ["bilby_laplace"]
omit = ["*/_version.py"]

[tool.coverage.report]
show_missing = true

[project.entry-points."bilby.samplers"]
"bilby.laplace" = "bilby_laplace.sampler:Laplace"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
# Write a version file so the package version is available at runtime
# without needing git.
write_to = "src/bilby_laplace/_version.py"
