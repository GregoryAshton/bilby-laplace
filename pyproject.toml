[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "bilby-laplace"
dynamic = ["version"]
description = "Bilby sampler plugin: Laplace approximation with rejection/importance resampling"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gregory Ashton" }]
requires-python = ">=3.10"
keywords = ["bayesian inference", "laplace approximation", "bilby", "gravitational waves"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "bilby>=2.7",
    "numpy",
    "scipy>=1.15",
    "pandas",
    "tqdm",
]

[project.optional-dependencies]
docs = [
    "mkdocs<2",
    "mkdocs-material",
    "mkdocstrings[python]",
    "pymdown-extensions",
]
test = [
    "pytest",
    "pytest-cov",
]

[project.urls]
Homepage = "https://github.com/GregoryAshton/bilby-laplace"
Documentation = "https://gregoryashton.github.io/bilby-laplace/"
Source = "https://github.com/GregoryAshton/bilby-laplace"
Issues = "https://github.com/GregoryAshton/bilby-laplace/issues"
Changelog = "https://github.com/GregoryAshton/bilby-laplace/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: end-to-end sampler runs (deselect with '-m \"not slow\"')",
    "gw: requires the bilby.gw stack",
    "smc: requires aspire + aspire_bilby",
]

[tool.coverage.run]
source = ["bilby_laplace"]
omit = ["*/_version.py"]

[tool.coverage.report]
show_missing = true

[project.entry-points."bilby.samplers"]
"bilby.laplace" = "bilby_laplace.sampler:Laplace"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
# Write a version file so the package version is available at runtime
# without needing git.
write_to = "src/bilby_laplace/_version.py"
